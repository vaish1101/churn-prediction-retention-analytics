[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-analytics"
version = "0.1.0"
description = "Leakage-safe churn prediction and retention decision analytics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "catboost==1.2.8",
  "matplotlib==3.10.7",
  "joblib==1.5.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

